<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #eef2f3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .calculator {
        background-color: #333;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 320px;
      }
      #display {
        width: 100%;
        height: 60px;
        background-color: #222;
        border: none;
        color: #fff;
        text-align: right;
        padding: 0 15px;
        font-size: 2rem;
        border-radius: 8px;
        box-sizing: border-box;
        margin-bottom: 20px;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      button {
        padding: 20px;
        font-size: 1.25rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #e0e0e0;
        transition: background 0.2s;
      }
      button:hover {
        background-color: #d4d4d4;
      }
      .operator {
        background-color: #ff9f0a;
        color: white;
      }
      .operator:hover {
        background-color: #cc7f08;
      }
      .equal {
        grid-row: span 2;
        background-color: #28a745;
        color: white;
      }
      .equal:hover {
        background-color: #1e7e34;
      }
      .zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" readonly />
      <div class="buttons">
        <button onclick="clearDisplay()" class="operator">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="deleteLast()" class="operator">DEL</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('-')" class="operator">-</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('+')" class="operator">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");

      // Add numbers or operators to the screen
      function appendValue(input) {
        display.value += input;
      }

      // Clear everything on the screen
      function clearDisplay() {
        display.value = "";
      }

      // Delete the very last character typed
      function deleteLast() {
        display.value = display.value.slice(0, -1);
      }

      // Safely evaluate the math string and show the result
      function calculate() {
        try {
          // eval handles the string math equation directly
          display.value = eval(display.value);
        } catch (error) {
          display.value = `error`;
        }
      }
    </script>
  </body>
</html>
